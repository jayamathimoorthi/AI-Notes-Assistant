<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Notes Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                AI
            </div>

            <div>
                <h2>
                    AI Notes
                </h2>

                <span>
                    Assistant
                </span>
            </div>

        </div>


        <button
            class="new-chat"
            id="newChatBtn"
        >
            + New Chat
        </button>


        <div class="sidebar-title">
            NOTES
        </div>


        <div
            class="upload-area"
            id="uploadArea"
        >

            <div class="upload-icon">
                📄
            </div>

            <strong>
                Upload PDF
            </strong>

            <span>
                Study from your notes
            </span>

        </div>


        <input
            type="file"
            id="pdfInput"
            accept=".pdf"
            hidden
        >
        <div class="sidebar-title recent-title">
            RECENT
        </div>


        <div
            id="recentChats"
            class="recent-chats"
        >
        </div>


        <div class="sidebar-bottom">

            <div class="language-label">
                Language
            </div>

            <select id="languageSelect">

                <option value="Tanglish">
                    Tanglish
                </option>

                <option value="Tamil">
                    தமிழ்
                </option>

                <option value="English">
                    English
                </option>

            </select>

        </div>

    </aside>



    <!-- MAIN AREA -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <button
                id="menuBtn"
                class="menu-btn"
            >
                ☰
            </button>


            <div class="top-title">

                <strong>
                    AI Notes Assistant
                </strong>

                <span id="fileStatus">
                    No PDF uploaded
                </span>

            </div>


            <select
                id="topLanguage"
                class="top-language"
            >

                <option value="Tanglish">
                    Tanglish
                </option>

                <option value="Tamil">
                    தமிழ்
                </option>

                <option value="English">
                    English
                </option>

            </select>

        </header>



        <!-- CHAT -->

        <section
            id="chat"
            class="chat"
        >


            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-icon">
                    ✨
                </div>

                <h1>
                    What would you like to learn?
                </h1>

                <p>
                    Upload your PDF notes and ask
                    questions from your notes.
                </p>


                <button
                    id="welcomeUpload"
                    class="welcome-upload"
                >
                    📄 Upload PDF Notes
                </button>

            </div>

        </section>



        <!-- INPUT AREA -->

        <div class="input-section">


            <div
                id="uploadStatus"
                class="upload-status"
            >
            </div>


            <div class="input-box">


                <textarea
                    id="questionInput"
                    rows="1"
                    placeholder="Ask something from your notes..."
                ></textarea>


                <button
                    id="sendBtn"
                    class="send-btn"
                >
                    ➤
                </button>

            </div>


            <p class="disclaimer">
                AI Notes Assistant answers using your uploaded notes.
            </p>

        </div>


    </main>

</div>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>

</body>

</html>
